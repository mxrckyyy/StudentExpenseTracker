services:
  - type: web
    name: student-expense-tracker
    runtime: dotnet
    repo: https://github.com/mxrckyyy/StudentExpenseTracker.git
    branch: master
    rootDir: StudentExpenseTracker
    buildCommand: dotnet publish -c Release -o release
    startCommand: ./release/StudentExpenseTracker
    healthCheckPath: /
    envVars:
      - key: ASPNETCORE_ENVIRONMENT
        value: Production
      # --- Aiven MySQL connection -----------------------------------------
      # The password is a secret: NEVER commit it to this file. Pick ONE of
      # the two formats below and set it in the Render Dashboard
      # (Dashboard -> select service -> Environment -> Add Environment Variable).
      #
      # Option 1 (recommended): ConnectionStrings__DefaultConnection
      #   Format (add the leading connectionString__ prefix is handled by
      #   using the key name exactly as-is):
      #   Server=mysql-XXXXXXXXX-YYYYYYY.a.aivencloud.com;Port=<AIVEN_PORT>;Database=defaultdb;User=avnadmin;Password=<AIVEN_PASSWORD>;SslMode=Required
      #   * Host, port, user and password come from the Aiven Console
      #     (Overview -> Connection information -> Connection tab of your MySQL service).
      #   * The app forces SslMode=Required in Production, so TLS is always used.
      #   * If the password contains ';' or spaces, wrap it in double quotes:
      #     Password="p@ss;word".
      #
      # Option 2: DATABASE_URL (Aiven "Service URI" style)
      #   mysql://avnadmin:<AIVEN_PASSWORD>@mysql-XXXXXXXXX-YYYYYYY.a.aivencloud.com:<AIVEN_PORT>/defaultdb?ssl-mode=REQUIRED
      #   * Program.cs parses this manually and unescapes special password
      #     characters (e.g. %23 for '#'), so percent-encode the password.
      - key: ConnectionStrings__DefaultConnection
        sync: false
      # Uncomment the line below instead if you prefer the URL format:
      # - key: DATABASE_URL
      #   sync: false